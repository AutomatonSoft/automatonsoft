server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    error_page 404 /404.html;

    # TLS ends at the host Nginx: relative Location headers keep redirects on https.
    absolute_redirect off;

    # The host Nginx proxies here over HTTP/1.0, so gzip must accept it explicitly.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/x-component;

    # Security headers for every response. Locations below use `expires` instead of add_header,
    # because any add_header inside a location would drop these inherited ones.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /404.html {
        internal;
    }

    location ^~ /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Uploads get unique names (Django suffixes collisions), so long caching is safe.
    location ^~ /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # Content-hashed Next.js build output never changes under the same URL.
    location ^~ /_next/static/ {
        expires 1y;
    }

    # Unhashed site assets (style.css keeps its name), so revalidate regularly.
    location ^~ /assets/ {
        expires 1h;
    }

    location = / {
        try_files /index.html =404;
    }

    # Legacy static-site URLs (/kontakt.html, /index.html) keep their ranking via 301 to the clean URL.
    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location / {
        # One canonical URL per page: /kontakt/ -> /kontakt instead of a 403 on the directory.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
}
