server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    error_page 404 /404.html;

    # The host Nginx proxies here over HTTP/1.0, so gzip must accept it explicitly.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/x-component;

    location = /404.html {
        internal;
    }

    location ^~ /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Uploads get unique names (Django suffixes collisions), so long caching is safe.
    location ^~ /media/ {
        alias /var/www/media/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Content-hashed Next.js build output never changes under the same URL.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed site assets (style.css keeps its name), so revalidate regularly.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ \.html$ {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
