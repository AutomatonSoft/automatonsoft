name: Website CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build Next.js static export
        run: |
          npm ci
          npm run build

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    runs-on: [self-hosted, linux, x64, automatonsoft-production]
    steps:
      - uses: actions/checkout@v4
      - name: Activate local Docker release
        run: |
          archive="website-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" Dockerfile Dockerfile.backend requirements.txt package.json package-lock.json next.config.mjs app lib public nginx automatonsoft backend
          install -m 600 "$archive" "/home/Automatonsoft/incoming/$archive"
          sudo -n /usr/local/sbin/deploy-automatonsoft "/home/Automatonsoft/incoming/$archive"
      - name: Verify public site
        run: curl --fail --silent --show-error --max-time 20 https://automatonsoft.com/
