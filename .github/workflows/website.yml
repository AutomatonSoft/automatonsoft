name: Website CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website bundle
        run: |
          test -f automatonsoft_website/index.html
          test -f automatonsoft_website/assets/css/style.css
          test -f automatonsoft_website/assets/js/main.js

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    runs-on: [self-hosted, linux, x64, automatonsoft-production]
    steps:
      - uses: actions/checkout@v4
      - name: Debug runner permissions
        run: |
          echo "USER=$(whoami)"
          id
          echo "HOME=$HOME"
          command -v sudo
          sudo -n -l || true
          sudo -n /usr/local/sbin/deploy-automatonsoft || true
      - name: Activate local Docker release
        run: |
          archive="website-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" Dockerfile automatonsoft_website
          install -m 600 "$archive" "/home/Automatonsoft/incoming/$archive"
          sudo -n /usr/local/sbin/deploy-automatonsoft "/home/Automatonsoft/incoming/$archive"
      - name: Verify public site
        run: curl --fail --silent --show-error --max-time 20 https://automatonsoft.com/
