# Missing URLs get the 404 page of their own language: the language prefix of the URL decides.
map $request_uri $not_found_page {
    default /nicht-gefunden.html;
    ~^/en(/|$|\?) /en/not-found.html;
}

server {
    listen 80;
    # No request log in the container: the nginx on the server already writes one (rotated there, see Datenschutz).
    access_log off;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    error_page 404 $not_found_page;

    # TLS ends at the host Nginx: relative Location headers keep redirects on https.
    absolute_redirect off;

    # The host Nginx proxies here over HTTP/1.0, so gzip must accept it explicitly.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/x-component;

    # Security headers for every response. Locations below use `expires` instead of add_header,
    # because any add_header inside a location would drop these inherited ones.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /404.html {
        internal;
    }

    location = /nicht-gefunden.html {
        internal;
    }

    location = /en/not-found.html {
        internal;
    }

    # The 404 pages are not content: opening them directly answers 404 with the same page.
    location ~ ^(/en)?/(nicht-gefunden|not-found)$ {
        return 404;
    }

    location ^~ /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Uploads get unique names (Django suffixes collisions), so long caching is safe.
    location ^~ /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # Content-hashed Next.js build output never changes under the same URL.
    location ^~ /_next/static/ {
        expires 1y;
    }

    # Unhashed site assets (images), so revalidate regularly.
    location ^~ /assets/ {
        expires 1h;
    }

    location = / {
        try_files /index.html =404;
    }

    # Legacy static-site URLs (/kontakt.html, /index.html) keep their ranking via 301 to the clean URL.
    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Project landing pages are prerendered at build time; projects added in the dashboard since then
    # get the client-rendered page, which loads the project from the API by the slug in the URL.
    location ~ ^(/en)?/portfolio/[^/]+$ {
        try_files $uri.html $1/portfolio/_.html =404;
    }

    # Social preview images generated by Next.js have no file extension, so name the type explicitly.
    location ~ /opengraph-image-[^/.]+$ {
        default_type image/png;
        expires 1h;
    }

    location / {
        # One canonical URL per page: /kontakt/ -> /kontakt instead of a 403 on the directory.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
}
