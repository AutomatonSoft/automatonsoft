services:
  website:
    build: ./current/frontend
    container_name: automatonsoft-website
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend
    volumes:
      - automatonsoft_media:/var/www/media:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  backend:
    build: ./current/backend
    container_name: automatonsoft-backend
    environment:
      # No debug pages in production. The secret key is then made on the first start and kept in /data/secret_key;
      # setting DJANGO_SECRET_KEY would take its place.
      DJANGO_DEBUG: 'false'
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_ALLOWED_HOSTS: automatonsoft.com,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://automatonsoft.com
    volumes:
      - automatonsoft_data:/data
      - automatonsoft_media:/app/media
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  automatonsoft_data:
  automatonsoft_media:
