server {
    listen 80;
    listen [::]:80;
    server_name automatonsoft.com www.automatonsoft.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://automatonsoft.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name automatonsoft.com www.automatonsoft.com;

    ssl_certificate /etc/letsencrypt/live/automatonsoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automatonsoft.com/privkey.pem;

    # The certificate already covers www; once DNS points www here, it redirects to the canonical host.
    if ($host = www.automatonsoft.com) {
        return 301 https://automatonsoft.com$request_uri;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18080;
    }
}
